plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.144'
}

group = 'com.economy.mod'
version = '1.19.4'
base { archivesName = 'trueeconomy-forge_1_19_4' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

sourceSets.main.java.srcDirs += [
        rootProject.file('core/src/main/java'),
        rootProject.file('glue-forge/src/main/java')
]

repositories {
    mavenCentral()
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.minecraftforge.net/" }
}

legacyForge {
    version = "1.19.4-45.4.1"
    validateAccessTransformers = true
    mods {
        trueeconomy { sourceSet sourceSets.main }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand(version: project.version) }
}
