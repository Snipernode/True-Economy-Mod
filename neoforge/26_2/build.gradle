plugins {
    id 'net.neoforged.moddev' version '2.0.144'
}

group = 'com.economy.mod'
version = '26.2'
base { archivesName = 'trueeconomy-neoforge_26_2' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

sourceSets.main.java.srcDirs += [
        rootProject.file('core/src/main/java'),
        rootProject.file('glue-forge/src/main/java')
]

repositories {
    mavenCentral()
    maven { url = "https://maven.neoforged.net/releases" }
}

neoForge {
    version = "26.2.0.88"
    runs {
        client {}
        server {}
    }
    mods {
        trueeconomy { sourceSet sourceSets.main }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}

tasks.named('createMinecraftArtifacts') {
    useEclipseCompiler.set(true)
}
