plugins {
    id 'net.fabricmc.fabric-loom'
    id 'java'
}

version = "26.1.1"
group = 'com.economy.mod'

dependencies {
    minecraft "com.mojang.minecraft:minecraft:26.1.1"
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.145.4+26.1.1"
    implementation project(':core')
    include project(':core')
    implementation 'com.google.code.gson:gson:2.11.0'
    include 'com.google.code.gson:gson:2.11.0'
}

sourceSets {
    main {
        java.srcDirs += project.file('../../glue-mojmap/src/main/java')
    }
}

java {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
