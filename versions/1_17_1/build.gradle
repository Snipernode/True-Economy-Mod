plugins {
    id 'fabric-loom' version '1.17.21'
    id 'java'
}

version = "1.17.1"
group = 'com.economy.mod'

dependencies {
    minecraft "com.mojang.minecraft:minecraft:1.17.1"
    mappings "net.fabricmc:yarn:1.17.1+build.65"
    modImplementation "net.fabricmc:fabric-loader:0.19.5"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.46.1+1.17"
    implementation project(':core')
    include project(':core')
    implementation 'com.google.code.gson:gson:2.11.0'
    include 'com.google.code.gson:gson:2.11.0'
}

sourceSets {
    main {
        java.srcDirs += project.file('../../glue/src/main/java')
    }
}

java {
    withSourcesJar()
}


processResources {
    inputs.property('modEnvironment', project.findProperty('modEnvironment') ?: '*')
    filesMatching('*.mod.json') { expand(modEnvironment: project.findProperty('modEnvironment') ?: '*') }
}

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
