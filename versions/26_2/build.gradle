plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'java'
}

version = "26.2"
group = 'com.economy.mod'

dependencies {
    minecraft "com.mojang.minecraft:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.161.0+26.2"
    implementation project(':core')
    include project(':core')
    implementation 'com.google.code.gson:gson:2.11.0'
    include 'com.google.code.gson:gson:2.11.0'
}

sourceSets {
    main {
        java.srcDirs += project.file('../../glue-mojmap/src/main/java')
    }
}

java {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}


processResources {
    inputs.property('modEnvironment', project.findProperty('modEnvironment') ?: '*')
    filesMatching('*.mod.json') { expand(modEnvironment: project.findProperty('modEnvironment') ?: '*') }
}

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
